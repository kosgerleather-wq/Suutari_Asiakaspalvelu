<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seuraa tilaustasi — Tehtaankatu Suutari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f8f9;
  --card-bg: #ffffff;
  --text: #1d2c3f;
  --text-muted: #60747d;
  --primary: #0f2d4a;
  --primary-light: #e6edef;
  --teal: #10b981;
  --teal-light: #ecfdf5;
  --orange: #f59e0b;
  --orange-light: #fefbeb;
  --red: #ef4444;
  --red-light: #fef2f2;
  --border: #e6edef;
}
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 90%;
  max-width: 480px;
  background: var(--card-bg);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(15,45,74,0.06);
  padding: 30px;
  box-sizing: border-box;
  text-align: center;
}
h1 {
  font-family: 'Outfit', sans-serif;
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 10px;
  color: var(--primary);
}
p.subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin: 0 0 25px;
}
.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}
.search-box input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: var(--bg);
}
.search-box button {
  padding: 12px 20px;
  background: var(--primary);
  color: white;
  border: 0;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s ease;
}
.search-box button:hover {
  background: #1d3c5c;
}
.result-card {
  border-radius: 12px;
  border: 1px solid var(--border);
  padding: 20px;
  text-align: left;
  display: none;
}
.result-card h3 {
  margin: 0 0 15px;
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  color: var(--primary);
}
.info-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 13px;
}
.info-row span {
  color: var(--text-muted);
}
.info-row strong {
  font-weight: 600;
}
hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 15px 0;
}
.timeline {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 20px;
  position: relative;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 10px;
  bottom: 10px;
  width: 2px;
  background: var(--border);
}
.step {
  display: flex;
  gap: 15px;
  position: relative;
}
.step i {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--border);
  border: 3px solid var(--card-bg);
  box-sizing: border-box;
  z-index: 2;
  margin-top: 2px;
}
.step.done i {
  background: var(--teal);
}
.step.active i {
  background: var(--orange);
  box-shadow: 0 0 0 4px var(--orange-light);
}
.step div {
  flex: 1;
}
.step div b {
  font-size: 13px;
  display: block;
  color: var(--text-muted);
}
.step.done div b, .step.active div b {
  color: var(--text);
}
.step div small {
  font-size: 11px;
  color: var(--text-muted);
}
.brand-footer {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-top: 25px;
  text-transform: uppercase;
}
.status-pill {
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
}
.status-pill.teal {
  background: var(--teal-light);
  color: var(--teal);
}
.status-pill.orange {
  background: var(--orange-light);
  color: var(--orange);
}
.status-pill.red {
  background: var(--red-light);
  color: var(--red);
}
</style>
</head>
<body>
<div class="container">
  <h1>Seuraa tilaustasi</h1>
  <p class="subtitle">Syötä työtilauskoodi seurataksesi korjaustyön etenemistä.</p>
  
  <div class="search-box">
    <input type="text" id="trackCode" placeholder="Esim. #1052">
    <button onclick="trackJob()">Hae</button>
  </div>
  
  <div class="result-card" id="resultCard">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
      <h3 id="resJobId">#1052</h3>
      <span class="status-pill" id="resStatusPill">Työn alla</span>
    </div>
    
    <div class="info-row">
      <span>Tuote:</span>
      <strong id="resProduct">Marimekko käsilaukku</strong>
    </div>
    <div class="info-row">
      <span>Tehty korjaus:</span>
      <strong id="resWork">Vetoketjun vaihto</strong>
    </div>
    <div class="info-row">
      <span>Arvioitu toimitus:</span>
      <strong id="resDate">28.08.2026</strong>
    </div>
    
    <hr>
    
    <div class="timeline" id="timeline"></div>
  </div>
  
  <div class="brand-footer">Tehtaankatu Suutari</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let supabaseClient = null;

function initSupabase() {
  // --- JOS HALUAT AKTIVOIDA SEURANNAN ASIAKKAIDEN PUHELIMISSA, SYÖTÄ TIEDOT TÄHÄN ---
  const publicUrl = "https://yjcpygwcbhmxtuqwvzkj.supabase.co"; // Esim: "https://xxxxxx.supabase.co"
  const publicKey = "sb_publishable_tBL_fxc91edlgH7WphAxbw_5ZVA1pje"; // Esim: "eyJhbGciOi..."
  
  const url = publicUrl || localStorage.getItem("suutari_db_url");
  const key = publicKey || localStorage.getItem("suutari_db_key");
  if(url && key && typeof supabase !== 'undefined') {
    supabaseClient = supabase.createClient(url, key);
    return true;
  }
  return false;
}
initSupabase();

async function getJobDetails(code) {
  // If Supabase is connected, call RPC status lookup for maximum privacy!
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient.rpc('get_job_status', { job_id: code });
      if (error) throw error;
      if (data && data.length > 0) return data[0];
    } catch(err) {
      console.error("Supabase RPC lookup failed, falling back to local:", err);
    }
  }
  
  // Local storage fallback
  const storedJobs = localStorage.getItem("suutari_jobs");
  if (storedJobs) {
    const jobs = JSON.parse(storedJobs);
    return jobs.find(j => j.id === code);
  }
  return null;
}

const statusLabel = {
  active: "Työn alla",
  waiting: "Odottaa materiaalia",
  arrived: "Tuote saapui",
  ready: "Valmis noudettavaksi",
  late: "Myöhässä",
  done: "Luovutettu asiakkaalle"
};

async function trackJob() {
  let code = document.getElementById("trackCode").value.trim();
  if(!code) return;
  if(!code.startsWith("#")) {
    code = "#" + code;
    document.getElementById("trackCode").value = code;
  }
  
  const card = document.getElementById("resultCard");
  const j = await getJobDetails(code);
  
  if(!j) {
    alert("Tilausta koodilla " + code + " ei löytynyt. Varmista koodin oikeinkirjoitus.");
    card.style.display = "none";
    return;
  }
  
  document.getElementById("resJobId").textContent = j.id;
  document.getElementById("resProduct").textContent = j.product;
  document.getElementById("resWork").textContent = j.work;
  document.getElementById("resDate").textContent = j.date;
  
  const pill = document.getElementById("resStatusPill");
  pill.textContent = statusLabel[j.status] || j.status;
  pill.className = "status-pill " + (j.status === "late" ? "red" : (j.status === "waiting" || j.status === "arrived") ? "orange" : "teal");
  
  // Render timeline steps
  const steps = [
    { label: "Vastaanotettu", status: "done" },
    { label: "Työn alla", status: j.status === "active" || j.status === "late" ? "active" : (j.status === "waiting" || j.status === "ready" || j.status === "done" ? "done" : "pending") },
    { label: "Valmis noudettavaksi", status: j.status === "ready" ? "active" : (j.status === "done" ? "done" : "pending") },
    { label: "Luovutettu asiakkaalle", status: j.status === "done" ? "done" : "pending" }
  ];
  
  // Special exception for material waiting / WhatsApp orders whose product
  // has arrived at the shop but work hasn't started yet
  if (j.status === "waiting") {
    steps[1] = { label: "Odottaa materiaalia", status: "active" };
  } else if (j.status === "arrived") {
    steps[1] = { label: "Tuote saapui, työ alkaa pian", status: "active" };
  }
  
  document.getElementById("timeline").innerHTML = steps.map(s => `
    <div class="step ${s.status}">
      <i></i>
      <div>
        <b>${s.label}</b>
        <small>${s.status === "done" ? "Valmis" : s.status === "active" ? "Käynnissä" : "Odottaa"}</small>
      </div>
    </div>
  `).join("");
  
  card.style.display = "block";
}

// Automatically search if code is in URL query parameters (?code=#1052)
const params = new URLSearchParams(window.location.search);
const codeParam = params.get("code");
if (codeParam) {
  document.getElementById("trackCode").value = codeParam;
  trackJob();
}
</script>
</body>
</html>
